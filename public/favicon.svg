<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="vpGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle Tile -->
  <rect width="64" height="64" rx="16" fill="url(#vpGrad)" />
  
  <!-- Subtle Internal Sheen Border -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="1.5" />
  
  <!-- Geometric Designer VP Symbol -->
  <g filter="url(#subtleGlow)">
    <text
      x="32"
      y="35"
      text-anchor="middle"
      dominant-baseline="central"
      fill="#FFFFFF"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif"
      font-weight="900"
      font-size="28"
      letter-spacing="-1.2"
    >VP</text>
  </g>
</svg>